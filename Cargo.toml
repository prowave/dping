[package]
name = "dping"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "On-demand tool for finding where packet loss or latency spikes are happening between your machine and the internet"
repository = "https://github.com/prowave/dping"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
csv = "1.4.0"
futures = "0.3.34"
netdev = "0.46.1"
ratatui = "0.30.2"
regex = "1.13.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process", "signal", "sync", "io-util"] }
tokio-util = "0.7.19"
